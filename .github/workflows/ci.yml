name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The plugin has no runtime dependencies. The three peer packages come
      # from a DSH installation, which CI does not have — so only the suites
      # that do not need them run here.
      - name: Run dependency-free suites
        run: npm test

      - name: Static validation of the client bundle
        run: npm run check

  package:
    name: Verify the published tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Catches missing files in `files` before a release does.
      - name: Pack and inspect
        run: |
          npm pack --dry-run 2>&1 | tee pack.txt
          for required in lib/index.mjs lib/client.js cordis.patch.yml icon.svg README.md LICENSE locale/en.json locale/zh.json; do
            if ! grep -q "$required" pack.txt; then
              echo "::error::missing from package: $required"
              exit 1
            fi
          done

      - name: Check the manifest declares what DSH needs
        run: |
          node -e '
            const p = require("./package.json");
            const fail = (m) => { console.error("::error::" + m); process.exit(1) };
            if (p.private === true) fail("package.json is still private: true — npm publish would be refused");
            if (!p.dsh?.bundle?.patch) fail("missing dsh.bundle.patch");
            if (!p.dsh?.client) fail("missing dsh.client");
            if (p.exports["."] !== "./lib/index.mjs") fail("bad main export");
            if (p.exports["./client"] !== "./lib/client.js") fail("bad client export");
            if (!p.license) fail("missing license");
            if (!p.repository?.url || p.repository.url.includes("YOUR_GITHUB_USERNAME")) fail("repository.url is still a placeholder");
            console.log("manifest ok");
          '