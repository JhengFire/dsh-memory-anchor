name: Release

# Publishes to npm when a version tag is pushed.
#
#   npm version patch
#   git push --follow-tags
#
# Requires an NPM_TOKEN secret in the repository settings
# (an npm automation token with publish rights for the package).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify the tag matches package.json
        run: |
          node -e '
            const p = require("./package.json");
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            if (p.version !== tag) {
              console.error(`::error::tag ${process.env.GITHUB_REF_NAME} does not match package.json version ${p.version}`);
              process.exit(1);
            }
            if (p.private === true) {
              console.error("::error::package.json is private: true");
              process.exit(1);
            }
            console.log(`publishing ${p.name}@${p.version}`);
          '

      - name: Run tests
        run: npm test

      - name: Validate the client bundle
        run: npm run check

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: CHANGELOG.md