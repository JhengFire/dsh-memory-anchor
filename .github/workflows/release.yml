name: Release

# Publishes to npm when a version tag is pushed, then creates the GitHub release.
#
#   npm version patch
#   git push --follow-tags
#
# Requires an NPM_TOKEN secret in the repository settings
# (an npm automation token with publish rights for the package).
#
# The job is idempotent: if the version already exists on npm — because it was
# published by hand, or because a tag was pushed twice — publishing is skipped
# and only the release is created. Re-running a release must never fail merely
# because the work was already done.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify the tag matches package.json
        run: |
          node -e '
            const p = require("./package.json");
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            if (p.version !== tag) {
              console.error(`::error::tag ${process.env.GITHUB_REF_NAME} does not match package.json version ${p.version}`);
              process.exit(1);
            }
            if (p.private === true) {
              console.error("::error::package.json is private: true");
              process.exit(1);
            }
            console.log(`ok: ${p.name}@${p.version}`);
          '

      - name: Run tests
        run: npm test

      - name: Validate the client bundle
        run: npm run check

      # Idempotency: decide whether this version still needs publishing.
      # `npm view` exits non-zero when the version is absent, which is the
      # normal case for a fresh release.
      - name: Check whether this version is already on npm
        id: exists
        run: |
          NAME=$(node -p 'require("./package.json").name')
          VERSION=$(node -p 'require("./package.json").version')
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${NAME}@${VERSION} is already on npm — skipping publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${NAME}@${VERSION} is not on npm yet — will publish"
          fi

      - name: Publish
        if: steps.exists.outputs.published == 'false'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: CHANGELOG.md